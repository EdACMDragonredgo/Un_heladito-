<section class="form-section container">
    <div class="section-title">
        <h2>Únete al Club "Puntos Heladitos"</h2>
        <p>Crea tu cuenta para recibir ofertas exclusivas y personalizar tus preferencias alimentarias.</p>
    </div>

    <form id="registroForm" class="custom-form" novalidate>
        <div class="form-group">
            <label for="nombre">Nombre Completo *</label>
            <input type="text" id="nombre" name="nombre" class="form-control" placeholder="Ej. Constanza Silva" autocomplete="name">
            <span class="error-message" id="error-nombre"></span>
        </div>

        <div class="form-group">
            <label for="email">Correo Electrónico *</label>
            <input type="email" id="email" name="email" class="form-control" placeholder="nombre@ejemplo.cl" autocomplete="email">
            <span class="error-message" id="error-email"></span>
        </div>

        <div class="form-group">
            <label for="preferencia">Preferencia de Alérgenos / Dieta</label>
            <select id="preferencia" name="preferencia" class="form-control">
                <option value="">Selecciona tu preferencia (Opcional)</option>
                <option value="sin-lactosa">Sin Lactosa / Intolerante</option>
                <option value="vegano">100% Vegano (Sorbetes)</option>
                <option value="sin-azucar">Sin Azúcar Añadida (Keto)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="password">Contraseña Segura *</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="Mínimo 8 caracteres, números y letras">
            <span class="error-message" id="error-password"></span>
        </div>

        <button type="submit" class="btn btn-primary">Crear Cuenta</button>
        <div id="form-success" class="success-banner" style="display:none; margin-top:15px; color:#2E7D32; font-weight:bold;"></div>
    </form>
</section>
