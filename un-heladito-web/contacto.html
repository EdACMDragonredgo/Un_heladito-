<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Un Heladito - Contacto y Registro</title>
    <link rel="stylesheet" href="css/contacto.css">
</head>
<body>

    <header class="main-header">
        <h1>🍦 Un Heladito</h1>
        <nav class="main-nav">
            <ul>
                <li><a href="index.html" class="nav-link">Inicio</a></li>
                <li><a href="catalogo.html" class="nav-link">Catálogo</a></li>
                <li><a href="nosotros.html" class="nav-link">Nosotros & Sucursales</a></li>
                <li><a href="estadisticas.html" class="nav-link">Estadísticas</a></li>
                <li><a href="contacto.html" class="nav-link active">Contacto / Registro</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <section class="contact-card">
            <h2>Escríbenos o Registra tu Solicitud</h2>
            <p>Déjanos tus datos y nos pondremos en contacto contigo a la brevedad.</p>

            <!-- novalidate evita el mensaje nativo del navegador para usar la validación personalizada de JS -->
            <form id="formContacto" novalidate>
                
                <div class="form-group">
                    <label for="nombre">Nombre Completo:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej: Maria González" autocomplete="name">
                    <small class="error-text" id="errorNombre"></small>
                </div>

                <div class="form-group">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" autocomplete="email">
                    <small class="error-text" id="errorEmail"></small>
                </div>

                <div class="form-group">
                    <label for="asunto">Motivo de Contacto:</label>
                    <select id="asunto" name="asunto">
                        <option value="">-- Selecciona una opción --</option>
                        <option value="consulta">Consulta General</option>
                        <option value="sugerencia">Sugerencia de Sabor</option>
                        <option value="reclamo">Reclamo o Problema</option>
                    </select>
                    <small class="error-text" id="errorAsunto"></small>
                </div>

                <div class="form-group">
                    <label for="mensaje">Mensaje:</label>
                    <textarea id="mensaje" name="mensaje" rows="4" placeholder="Escribe tu mensaje aquí..."></textarea>
                    <small class="error-text" id="errorMensaje"></small>
                </div>

                <button type="submit" class="btn-primary">Enviar Mensaje</button>
                <div id="mensajeExito" class="success-text"></div>
            </form>
        </section>
    </main>

    <footer class="main-footer">
        <p>&copy; 2026 Un Heladito. Todos los derechos reservados.</p>
    </footer>

    <!-- Vinculación del archivo JS externo con la lógica de validación -->
    <script src="funciones.js"></script>
</body>
</html>
